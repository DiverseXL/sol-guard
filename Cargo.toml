# Standalone crate (own [workspace]): built for wasm32-wasip2 as a ZeroClaw
# tool plugin component; the pure `guard` core (rlib) is host-tested with a
# plain `cargo test`. `waki` (the blocking wasi:http client) is a wasm-only
# dependency so the host test build never tries to compile it — same pattern
# as plugins/telegram.
[package]
name = "sol-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: Solana token risk & safety checker (T0, read-only)."
publish = false

# cdylib for the wasm component; rlib so the pure risk-assessment core is
# testable on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
