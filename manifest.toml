name = "sol-guard"
version = "0.1.0"
description = "Solana token risk & safety checker for ZeroClaw agents: mint/freeze authority, holder concentration, Token-2022 extensions, red/amber/green verdict (T0, read-only)."
author = "DiverseXL"
wasm_path = "sol_guard.wasm"
capabilities = ["tool"]
# http_client: outbound calls to a user-configured Solana RPC endpoint (TLS
# is performed host-side). No private keys, no signing, no submission —
# this plugin only ever reads.
# config_read: the host injects this plugin's own config section (rpc_url)
# into execute args as `__config`. Without it the plugin falls back to a
# public default RPC endpoint.
permissions = ["http_client", "config_read"]